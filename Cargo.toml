[workspace]
members = ["protocol", "client", "server", "proxy"]
resolver = "2"

[workspace.package]
version = "1.0.5-beta.3"
edition = "2024"

[profile.release]
opt-level    = "z"
strip        = true
lto          = true
codegen-units = 1
panic        = "abort"

[patch.crates-io]
smoltcp = { git = "https://github.com/smoltcp-rs/smoltcp", branch = "tcp-more-fixes" }

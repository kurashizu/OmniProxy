mixed-port: 7890
allow-lan: false
log-level: info
mode: global

tun:
    enable: true
    stack: mixed
    auto-route: true
    auto-detect-interface: true
    dns-hijack:
        - "any:53"

dns:
    enable: true
    listen: 0.0.0.0:1053
    enhanced-mode: fake-ip
    fake-ip-range: 198.18.0.1/16
    nameserver:
        - 223.5.5.5

proxies:
    - name: "S5"
      type: socks5
      server: 127.0.0.1
      port: 1080
      udp: true

proxy-groups:
    - name: GLOBAL
      type: select
      proxies:
          - "S5"

name: GUI (Windows)

on:
    push:
        branches:
            - testing
    workflow_dispatch:

permissions:
    contents: write

env:
    CARGO_TARGET_DIR: /home/runner/work/OmniProxy/OmniProxy/target/ci

jobs:
    build-proxy:
        name: Build proxy.exe
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: "."
                  shared-key: gui-windows
                  cache-on-failure: true
                  cache-targets: true

            - name: Build proxy
              env:
                  RUSTFLAGS: "-Ctarget-feature=+crt-static"
              shell: bash
              run: cargo build -p proxy --release --target x86_64-pc-windows-msvc

            - name: Upload proxy.exe
              uses: actions/upload-artifact@v7
              with:
                  name: gui-proxy-exe
                  path: target/ci/x86_64-pc-windows-msvc/release/proxy.exe
                  if-no-files-found: error
                  retention-days: 2

    build-client:
        name: Build client.exe
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: "."
                  shared-key: gui-windows
                  cache-on-failure: true
                  cache-targets: true

            - name: Build client
              env:
                  RUSTFLAGS: "-Ctarget-feature=+crt-static"
              shell: bash
              run: cargo build -p client --release --target x86_64-pc-windows-msvc

            - name: Upload client.exe
              uses: actions/upload-artifact@v7
              with:
                  name: gui-client-exe
                  path: target/ci/x86_64-pc-windows-msvc/release/client.exe
                  if-no-files-found: error
                  retention-days: 2

    build-gui:
        name: Build omniproxy-gui.exe
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: gui/src-tauri
                  shared-key: gui-windows
                  cache-on-failure: true
                  cache-targets: true

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"
                  cache-dependency-path: gui/pnpm-lock.yaml

            - name: Install frontend deps
              working-directory: gui
              shell: bash
              run: pnpm install --frozen-lockfile

            - name: Download wintun.dll
              shell: powershell
              run: |
                  curl.exe -sL https://www.wintun.net/builds/wintun-0.14.1.zip -o wintun.zip
                  Expand-Archive -Force wintun.zip -DestinationPath wintun
                  $dll = Get-ChildItem -Recurse -Path wintun -Filter wintun.dll | Select-Object -First 1 -ExpandProperty FullName
                  if (-not $dll) { throw "wintun.dll not found" }
                  New-Item -ItemType Directory -Force -Path target/ci/x86_64-pc-windows-msvc/release | Out-Null
                  Copy-Item $dll target/ci/x86_64-pc-windows-msvc/release/wintun.dll

            - name: Seed Tauri resources
              shell: bash
              working-directory: gui/src-tauri
              run: |
                  mkdir -p resources
                  : > resources/proxy.exe
                  : > resources/client.exe
                  cp ../../target/ci/x86_64-pc-windows-msvc/release/wintun.dll resources/wintun.dll

            - name: Build omniproxy-gui
              env:
                  RUSTFLAGS: "-Ctarget-feature=+crt-static"
              shell: bash
              working-directory: gui/src-tauri
              run: cargo build -p omniproxy-gui --release --target x86_64-pc-windows-msvc

            - name: Upload omniproxy-gui.exe
              uses: actions/upload-artifact@v7
              with:
                  name: gui-omniproxy-gui-exe
                  path: target/ci/x86_64-pc-windows-msvc/release/omniproxy-gui.exe
                  if-no-files-found: error
                  retention-days: 2

    package:
        name: Assemble portable zip
        needs: [build-proxy, build-client, build-gui]
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v6

            - name: Download proxy.exe
              uses: actions/download-artifact@v8
              with:
                  name: gui-proxy-exe
                  path: dist
                  merge-multiple: true

            - name: Download client.exe
              uses: actions/download-artifact@v8
              with:
                  name: gui-client-exe
                  path: dist
                  merge-multiple: true

            - name: Download omniproxy-gui.exe
              uses: actions/download-artifact@v8
              with:
                  name: gui-omniproxy-gui-exe
                  path: dist
                  merge-multiple: true

            - name: Download wintun.dll
              shell: powershell
              run: |
                  curl.exe -sL https://www.wintun.net/builds/wintun-0.14.1.zip -o wintun.zip
                  Expand-Archive -Force wintun.zip -DestinationPath wintun
                  $dll = Get-ChildItem -Recurse -Path wintun -Filter wintun.dll | Select-Object -First 1 -ExpandProperty FullName
                  if (-not $dll) { throw "wintun.dll not found" }
                  Copy-Item $dll dist/wintun.dll

            - name: Stage package
              shell: bash
              run: |
                  mkdir -p dist/resources
                  mv dist/proxy.exe dist/resources/proxy.exe
                  mv dist/client.exe dist/resources/client.exe
                  mv dist/wintun.dll dist/resources/wintun.dll
                  cp proxy/config.windows.yml dist/config.yml
                  cp README.md dist/ 2>/dev/null || true
                  ls -la dist
                  ls -la dist/resources

            - name: Smoke test
              shell: bash
              run: |
                  test -f dist/omniproxy-gui.exe
                  test -f dist/config.yml
                  test -f dist/resources/proxy.exe
                  test -f dist/resources/client.exe
                  test -f dist/resources/wintun.dll

            - name: Create zip
              shell: powershell
              run: |
                  $zip = "omniproxy-gui-windows-x86_64.zip"
                  if (Test-Path $zip) { Remove-Item -Force $zip }
                  Compress-Archive -Path dist\* -DestinationPath $zip

            - name: Upload package
              uses: actions/upload-artifact@v7
              with:
                  name: omniproxy-gui-windows-x86_64
                  path: omniproxy-gui-windows-x86_64.zip
                  if-no-files-found: error
                  retention-days: 14

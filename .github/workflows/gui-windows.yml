name: GUI (Windows)

on:
    push:
        branches:
            - testing
    workflow_dispatch:

permissions:
    contents: write

env:
    CARGO_TARGET_DIR: target/ci

jobs:
    build-and-package:
        name: Build green GUI package
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: "."
                  cache-on-failure: true
                  shared-key: gui-windows
                  cache-targets: true

            - name: Install pnpm
              uses: pnpm/action-setup@v4
              with:
                  version: 9

            - name: Set up Node
              uses: actions/setup-node@v4
              with:
                  node-version: "20"
                  cache: "pnpm"
                  cache-dependency-path: gui/pnpm-lock.yaml

            - name: Install frontend deps
              working-directory: gui
              shell: bash
              run: pnpm install --frozen-lockfile

            - name: Build proxy.exe
              env:
                  CARGO_TARGET_DIR: target/ci
                  RUSTFLAGS: "-Ctarget-feature=+crt-static"
              shell: bash
              run: cargo build -p proxy --release --target x86_64-pc-windows-msvc

            - name: Build client.exe
              env:
                  CARGO_TARGET_DIR: target/ci
                  RUSTFLAGS: "-Ctarget-feature=+crt-static"
              shell: bash
              run: cargo build -p client --release --target x86_64-pc-windows-msvc

            - name: Download wintun.dll
              shell: powershell
              run: |
                  curl.exe -sL https://www.wintun.net/builds/wintun-0.14.1.zip -o wintun.zip
                  Expand-Archive -Force wintun.zip -DestinationPath wintun
                  $dll = Get-ChildItem -Recurse -Path wintun -Filter wintun.dll | Select-Object -First 1 -ExpandProperty FullName
                  if (-not $dll) { throw "wintun.dll not found" }
                  Copy-Item $dll target/ci/x86_64-pc-windows-msvc/release/wintun.dll

            - name: Seed Tauri resources
              shell: bash
              working-directory: gui/src-tauri
              run: |
                  mkdir -p resources
                  cp ../../target/ci/x86_64-pc-windows-msvc/release/proxy.exe resources/proxy.exe
                  cp ../../target/ci/x86_64-pc-windows-msvc/release/client.exe resources/client.exe
                  cp ../../target/ci/x86_64-pc-windows-msvc/release/wintun.dll resources/wintun.dll

            - name: Build omniproxy-gui.exe
              env:
                  CARGO_TARGET_DIR: target/ci
                  RUSTFLAGS: "-Ctarget-feature=+crt-static"
              shell: bash
              working-directory: gui/src-tauri
              run: cargo build -p omniproxy-gui --release --target x86_64-pc-windows-msvc

            - name: Assemble package
              shell: bash
              run: |
                  rm -rf dist
                  mkdir -p dist/resources
                  cp target/ci/x86_64-pc-windows-msvc/release/proxy.exe dist/
                  cp target/ci/x86_64-pc-windows-msvc/release/client.exe dist/
                  cp target/ci/x86_64-pc-windows-msvc/release/wintun.dll dist/resources/
                  cp target/ci/x86_64-pc-windows-msvc/release/omniproxy-gui.exe dist/
                  cp proxy/config.windows.yml dist/config.yml
                  cp README.md dist/ 2>/dev/null || true

            - name: Smoke test
              shell: bash
              run: |
                  test -f dist/proxy.exe
                  test -f dist/client.exe
                  test -f dist/omniproxy-gui.exe
                  test -f dist/resources/wintun.dll
                  test -f dist/config.yml

            - name: Create zip
              shell: powershell
              run: |
                  $zip = "omniproxy-gui-windows-x86_64.zip"
                  if (Test-Path $zip) { Remove-Item -Force $zip }
                  Compress-Archive -Path dist\* -DestinationPath $zip

            - name: Upload package
              uses: actions/upload-artifact@v7
              with:
                  name: omniproxy-gui-windows-x86_64
                  path: omniproxy-gui-windows-x86_64.zip
                  if-no-files-found: error
                  retention-days: 14

name: Build Gui

on:
    push:
        branches: ["*"]
        tags-ignore:
            - "v*"
    pull_request:
    workflow_dispatch:

jobs:
    build:
        strategy:
            matrix:
                include:
                    - target: x86_64-unknown-linux-gnu
                      os: ubuntu-latest
                      ext: ""
                      name: linux-x86_64

                    - target: x86_64-pc-windows-msvc
                      os: windows-latest
                      ext: .exe
                      name: windows-x86_64

                    - target: aarch64-apple-darwin
                      os: macos-latest
                      ext: ""
                      name: macos-aarch64

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install system dependencies (Linux)
              if: startsWith(matrix.os, 'ubuntu')
              run: |
                  sudo apt-get update
                  sudo apt-get install -y \
                      libxcb-shape0-dev libxcb-xfixes0-dev \
                      libxcb1-dev libxkbcommon-dev \
                      libgl1-mesa-dev libegl1-mesa-dev

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: "."

            - name: Build
              run: cargo build -p gui --release --target ${{ matrix.target }}

            - name: Verify binary
              run: ls -lh target/${{ matrix.target }}/release/gui${{ matrix.ext }}
              shell: bash

            - name: Install FUSE (Linux)
              if: startsWith(matrix.os, 'ubuntu')
              run: sudo apt-get install -y fuse libfuse2
              shell: bash

            - name: Bundle .app (macOS)
              if: matrix.os == 'macos-latest'
              run: bash scripts/bundle_gui.sh target/${{ matrix.target }}/release

            - name: Bundle AppImage (Linux)
              if: startsWith(matrix.os, 'ubuntu')
              run: bash scripts/bundle_appimage.sh target/${{ matrix.target }}/release
              shell: bash

            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: gui-${{ matrix.name }}
                  path: |
                      target/${{ matrix.target }}/release/gui${{ matrix.ext }}
                      target/${{ matrix.target }}/release/*.app/
                      target/${{ matrix.target }}/release/*.AppImage
                  retention-days: 2

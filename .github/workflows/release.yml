name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            zip: socks5-proxy-windows-x86_64-msvc.zip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            zip: socks5-proxy-linux-x86_64-musl.zip

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client
            server

      - name: Build client
        run: |
          cargo build --release --manifest-path client/Cargo.toml --target ${{ matrix.target }}
          mkdir -p dist
          cp client/target/${{ matrix.target }}/release/client${{ matrix.ext }} dist/
        shell: bash

      - name: Build server
        run: |
          cargo build --release --manifest-path server/Cargo.toml --target ${{ matrix.target }}
          mkdir -p dist
          cp server/target/${{ matrix.target }}/release/server${{ matrix.ext }} dist/
        shell: bash

      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp scripts/proxy.sh dist/
          cp README.md dist/
          zip -r ${{ matrix.zip }} dist/
        shell: bash

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          cp README.md dist/
          Compress-Archive -Path dist -DestinationPath ${{ matrix.zip }}
        shell: powershell

      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: socks5-proxy-linux-x86_64-musl.zip
          path: .

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: socks5-proxy-windows-x86_64-msvc.zip
          path: .

      - name: Upload to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            socks5-proxy-linux-x86_64-musl.zip
            socks5-proxy-windows-x86_64-msvc.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    strategy:
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: .exe
            zip: socks5-proxy-windows-x86_64-msvc.zip
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            ext: ""
            zip: socks5-proxy-linux-x86_64-musl.zip

    runs-on: ${{ matrix.os }}

    steps:
      # ── Setup ────────────────────────────────────────────────────────────────
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            client
            server

      # ── Build ───────────────────────────────────────────────────────────────
      - name: Build client
        run: |
          cargo build --release --manifest-path client/Cargo.toml --target ${{ matrix.target }}
          mkdir -p dist
          cp client/target/${{ matrix.target }}/release/client${{ matrix.ext }} dist/
        shell: bash

      - name: Build server
        run: |
          cargo build --release --manifest-path server/Cargo.toml --target ${{ matrix.target }}
          mkdir -p dist
          cp server/target/${{ matrix.target }}/release/server${{ matrix.ext }} dist/
        shell: bash

      # ── Download tun2socks ──────────────────────────────────────────────────
      - name: Download tun2socks (Linux)
        if: matrix.os == 'ubuntu-latest'
        continue-on-error: true
        run: |
          curl -sL https://github.com/xjasonlyu/tun2socks/releases/download/v2.6.0/tun2socks-linux-amd64.zip -o tun2socks.zip
          unzip -o tun2socks.zip
          mv tun2socks-linux-amd64 tun2socks
          chmod +x tun2socks
        shell: bash

      - name: Download tun2socks (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: |
          curl.exe -sL https://github.com/xjasonlyu/tun2socks/releases/download/v2.6.0/tun2socks-windows-amd64-v3.zip -o tun2socks.zip
          Expand-Archive -Force tun2socks.zip -DestinationPath .
          mv tun2socks-windows-amd64-v3.exe tun2socks.exe
        shell: powershell

      - name: Download wintun (Windows)
        if: matrix.os == 'windows-latest'
        continue-on-error: true
        run: |
          curl.exe -sL https://www.wintun.net/builds/wintun-0.14.1.zip -o wintun.zip
          Expand-Archive -Force wintun.zip -DestinationPath wintun
          cp wintun/bin/amd64/wintun.dll dist/
        shell: powershell

      # ── Package ──────────────────────────────────────────────────────────────
      - name: Package Linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          cp scripts/proxy.sh dist/
          cp README.md dist/
          cp tun2socks dist/ || true
          zip -r ${{ matrix.zip }} dist/
        shell: bash

      - name: Package Windows
        if: matrix.os == 'windows-latest'
        run: |
          cp README.md dist/
          cp scripts/proxy.ps1 dist/
          if (Test-Path tun2socks.exe) { cp tun2socks.exe dist/ }
          Compress-Archive -Path dist -DestinationPath ${{ matrix.zip }}
        shell: powershell

      # ── Upload ──────────────────────────────────────────────────────────────
      - name: Upload assets
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: ${{ matrix.zip }}

  # ── Release ────────────────────────────────────────────────────────────────
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Download Linux
        uses: actions/download-artifact@v4
        with:
          name: socks5-proxy-linux-x86_64-musl.zip
          path: .

      - name: Download Windows
        uses: actions/download-artifact@v4
        with:
          name: socks5-proxy-windows-x86_64-msvc.zip
          path: .

      - name: Upload to release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            socks5-proxy-linux-x86_64-musl.zip
            socks5-proxy-windows-x86_64-msvc.zip
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

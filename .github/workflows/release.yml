name: Release

on:
    push:
        tags:
            - "v*"
    # Also by hand, so a new target can be proven before it is attached to a tag.
    workflow_dispatch:

jobs:
    # ── Build CLI ─────────────────────────────────────────────────────
    build:
        strategy:
            matrix:
                include:
                    - target: x86_64-pc-windows-msvc
                      os: windows-latest
                      ext: .exe
                      name: windows-x86_64

                    - target: aarch64-pc-windows-msvc
                      os: windows-11-arm
                      ext: .exe
                      name: windows-aarch64

                    - target: x86_64-unknown-linux-musl
                      os: ubuntu-latest
                      ext: ""
                      name: linux-x86_64

                    - target: aarch64-unknown-linux-musl
                      os: ubuntu-24.04-arm
                      ext: ""
                      name: linux-aarch64

                    # No riscv64 runner exists, so this one is cross-compiled
                    # with a musl toolchain and cannot be run here to check.
                    - target: riscv64gc-unknown-linux-musl
                      os: ubuntu-latest
                      ext: ""
                      name: linux-riscv64
                      cross: true
                      toolchain: riscv64-unknown-linux-musl

                    - target: x86_64-apple-darwin
                      os: macos-latest
                      ext: ""
                      name: macos-x86_64

                    - target: aarch64-apple-darwin
                      os: macos-latest
                      ext: ""
                      name: macos-aarch64

        runs-on: ${{ matrix.os }}

        steps:
            - uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: ${{ matrix.target }}

            - name: Install musl tools
              if: startsWith(matrix.os, 'ubuntu') && !matrix.cross
              run: sudo apt-get update && sudo apt-get install -y musl-tools
              shell: bash

            - name: Install the cross toolchain
              # cross-rs has no image for this target and quietly falls back to
              # the host compiler, which then cannot find a riscv64 linker. A
              # musl toolchain on PATH is both simpler and easier to read.
              if: matrix.cross
              run: |
                  curl -sSfL "https://github.com/cross-tools/musl-cross/releases/latest/download/${{ matrix.toolchain }}.tar.xz" \
                    | sudo tar xJ -C /opt
                  echo "/opt/${{ matrix.toolchain }}/bin" >> "$GITHUB_PATH"
              shell: bash

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: "."

            - name: Build CLI
              env:
                  RUSTFLAGS: ${{ startsWith(matrix.os, 'windows') && '-Ctarget-feature=+crt-static' || '' }}
                  CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: ${{ matrix.toolchain && format('{0}-gcc', matrix.toolchain) || '' }}
                  CC_riscv64gc_unknown_linux_musl: ${{ matrix.toolchain && format('{0}-gcc', matrix.toolchain) || '' }}
                  AR_riscv64gc_unknown_linux_musl: ${{ matrix.toolchain && format('{0}-ar', matrix.toolchain) || '' }}
              run: cargo build -p client -p server -p proxy --release --target ${{ matrix.target }}

            - name: Set executable permissions
              run: |
                  chmod +x target/${{ matrix.target }}/release/client
                  chmod +x target/${{ matrix.target }}/release/server
                  chmod +x target/${{ matrix.target }}/release/proxy
              shell: bash

            - name: Ad-hoc sign (macOS)
              if: matrix.os == 'macos-latest'
              run: |
                  codesign --force --sign - target/${{ matrix.target }}/release/client
                  codesign --force --sign - target/${{ matrix.target }}/release/server
                  codesign --force --sign - target/${{ matrix.target }}/release/proxy
              shell: bash

            - name: Download wintun (Windows)
              if: startsWith(matrix.os, 'windows')
              continue-on-error: true
              run: |
                  curl.exe -sL https://www.wintun.net/builds/wintun-0.14.1.zip -o wintun.zip
                  Expand-Archive -Force wintun.zip -DestinationPath .
                  if ("${{ matrix.target }}" -eq "x86_64-pc-windows-msvc") {
                      $dll = Get-ChildItem -Recurse -Path */bin/amd64/wintun.dll | Select-Object -First 1 -ExpandProperty FullName
                  } elseif ("${{ matrix.target }}" -eq "aarch64-pc-windows-msvc") {
                      $dll = Get-ChildItem -Recurse -Path */bin/arm64/wintun.dll | Select-Object -First 1 -ExpandProperty FullName
                  }
                  cp $dll target/${{ matrix.target }}/release/
              shell: powershell

            - name: Smoke test
              # Skipped where the binaries are for another architecture than the
              # runner: there is nothing here that can execute them.
              if: ${{ !matrix.cross }}
              run: |
                  ./target/${{ matrix.target }}/release/client${{ matrix.ext }} --version
                  ./target/${{ matrix.target }}/release/server${{ matrix.ext }} --version
                  ./target/${{ matrix.target }}/release/proxy${{ matrix.ext }} --version
              shell: bash

            - name: Upload CLI artifacts
              uses: actions/upload-artifact@v7
              with:
                  name: cli-${{ matrix.name }}
                  path: |
                      target/${{ matrix.target }}/release/client${{ matrix.ext }}
                      target/${{ matrix.target }}/release/server${{ matrix.ext }}
                      target/${{ matrix.target }}/release/proxy${{ matrix.ext }}
                      target/${{ matrix.target }}/release/wintun.dll
                  if-no-files-found: error
                  retention-days: 2

    # ── Package ───────────────────────────────────────────────────────
    package:
        needs: [build]
        strategy:
            matrix:
                include:
                    - name: windows-x86_64
                      archive: omni-proxy-windows-x86_64-msvc.zip
                      ext: .exe
                      config: proxy/config.windows.yml
                      platform: windows

                    - name: windows-aarch64
                      archive: omni-proxy-windows-aarch64-msvc.zip
                      ext: .exe
                      config: proxy/config.windows.yml
                      platform: windows

                    - name: linux-x86_64
                      archive: omni-proxy-linux-x86_64.tar.xz
                      ext: ""
                      config: proxy/config.linux.yml
                      platform: linux

                    - name: linux-aarch64
                      archive: omni-proxy-linux-aarch64.tar.xz
                      ext: ""
                      config: proxy/config.linux.yml
                      platform: linux

                    - name: linux-riscv64
                      archive: omni-proxy-linux-riscv64.tar.xz
                      ext: ""
                      config: proxy/config.linux.yml
                      platform: linux

                    - name: macos-x86_64
                      archive: omni-proxy-macos-x86_64.tar.xz
                      ext: ""
                      config: proxy/config.macos.yml
                      platform: macos

                    - name: macos-aarch64
                      archive: omni-proxy-macos-aarch64.tar.xz
                      ext: ""
                      config: proxy/config.macos.yml
                      platform: macos

        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Download CLI artifacts
              uses: actions/download-artifact@v8
              with:
                  name: cli-${{ matrix.name }}
                  path: cli
                  merge-multiple: true

            - name: Assemble dist
              run: |
                  mkdir -p dist

                  # CLI binaries
                  cp cli/client${{ matrix.ext }} dist/
                  cp cli/server${{ matrix.ext }} dist/
                  cp cli/proxy${{ matrix.ext }} dist/

                  # Windows extras
                  if [ "${{ matrix.platform }}" = "windows" ]; then
                      cp cli/wintun.dll dist/ 2>/dev/null || true
                  fi

                  # Config
                  cp ${{ matrix.config }} dist/config.yml

                  # macOS extras
                  if [ "${{ matrix.platform }}" = "macos" ]; then
                      cp scripts/setup_macos.sh dist/
                  fi


                  # README

                  # Set executable permissions (Unix)
                  if [ "${{ matrix.platform }}" != "windows" ]; then
                      chmod +x dist/client dist/server dist/proxy
                  fi
                  cp README.md dist/ 2>/dev/null || true

            - name: Create archive (tar.xz)
              if: matrix.platform != 'windows'
              run: tar -cJf ${{ matrix.archive }} dist/

            - name: Create archive (zip)
              if: matrix.platform == 'windows'
              run: zip -r ${{ matrix.archive }} dist/

            - name: Upload archive
              uses: actions/upload-artifact@v7
              with:
                  name: ${{ matrix.archive }}
                  path: ${{ matrix.archive }}
                  retention-days: 2

    # ── Release ───────────────────────────────────────────────────────
    release:
        needs: package
        runs-on: ubuntu-latest
        permissions:
            contents: write

        steps:
            - name: Download all artifacts
              uses: actions/download-artifact@v8
              with:
                  path: artifacts
                  merge-multiple: true

            - name: Upload to release
              uses: softprops/action-gh-release@v3
              with:
                  files: |
                      artifacts/*.zip
                      artifacts/*.tar.xz
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

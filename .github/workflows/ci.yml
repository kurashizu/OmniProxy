name: Build Test

on:
    push:
        branches: ["*"]
        tags-ignore:
            - "v*"
    pull_request:

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-unknown-linux-musl

            - name: Install musl tools
              run: sudo apt-get update && sudo apt-get install -y musl-tools

            - name: Cache cargo
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: "."

            - name: Build
              env:
                  RUSTFLAGS: "--cfg tokio_unstable"
              run: |
                  cargo build -p client --features console --release --target x86_64-unknown-linux-musl
                  cargo build -p server --features console --release --target x86_64-unknown-linux-musl
                  cargo build -p proxy --release --target x86_64-unknown-linux-musl

            - name: Smoke test
              run: |
                  ./target/x86_64-unknown-linux-musl/release/client --version
                  ./target/x86_64-unknown-linux-musl/release/server --version
                  ./target/x86_64-unknown-linux-musl/release/proxy --version

            - name: Upload artifacts
              uses: actions/upload-artifact@v4
              with:
                  name: linux-x86_64-musl
                  path: |
                      target/x86_64-unknown-linux-musl/release/client
                      target/x86_64-unknown-linux-musl/release/server
                      target/x86_64-unknown-linux-musl/release/proxy
                  retention-days: 2

# ── Core Executable Paths ─────────────────────────────────────────────────────
# Relative paths targeting Linux binaries (no extension).
# Assumes these binaries reside in the same folder as the proxy manager.
client: "./client"

# ── Remote Server Configuration ───────────────────────────────────────────────
server: "your-server-domain.com"
token: "my_secure_super_secret_token_123"

# ── Local Network & TUN Interface Settings ────────────────────────────────────
socks_port: 1080

# TUN interface name (standard for Linux)
tun_name: "tun0"

# TUN virtual IP and CIDR prefix
tun_ip: "198.18.0.1"
tun_prefix: 16

# IPv6 TUN settings
tun_ip6: "fd00::1"
tun_prefix6: 64

# Physical interface auto-detection (leave empty for auto)
phys_iface: ""

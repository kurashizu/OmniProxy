<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Server Status</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: #0f172a;
    color: #e2e8f0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }
  .card {
    background: #1e293b;
    border-radius: 16px;
    padding: 48px 56px;
    text-align: center;
    box-shadow: 0 25px 50px -12px rgba(0,0,0,.5);
  }
  .status {
    display: inline-flex;
    align-items: center;
    gap: 10px;
    background: #064e3b;
    color: #6ee7b7;
    padding: 8px 20px;
    border-radius: 999px;
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 24px;
  }
  .dot {
    width: 10px; height: 10px;
    background: #22c55e;
    border-radius: 50%;
    animation: pulse 2s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: .4; }
  }
  .status { margin-bottom: 0; }
</style>
</head>
<body>
<div class="card">
  <div class="status">
    <span class="dot"></span>
    Service is running
  </div>
</div>
</body>
</html>
